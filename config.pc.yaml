# Variante pour le développement sur PC (micro et haut-parleur de l'ordinateur,
# Whisper sur CPU, LED affichée dans la console).
# Lancement : python -m jone --config config.pc.yaml

audio_input:
  backend: sounddevice

stt:
  model: small                  # large-v3-turbo est trop lent sans GPU NVIDIA
  device: cpu
  compute_type: int8

audio_output:
  backend: sounddevice

led:
  backend: console

llm:
  cloud:
    provider: groq              # pas de clé Anthropic pour l'instant (GROQ_API_KEY dans .env)
