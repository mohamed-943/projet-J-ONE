[project]
name = "stt-transformer"
version = "0.1.0"
description = "Recherche : Transformer STT entraîné de zéro (français), comparé au pipeline Whisper de J-ONE"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "soundfile>=0.14.0",
    "torch>=2.15.0",
    "torchaudio>=2.11.1",
]

[dependency-groups]
dev = [
    "nbconvert>=7.17.2",
]
